<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOH SIM - 로그인</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #3770BF; }

        .auth-panel { max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #3770BF; box-shadow: 0 0 0 3px rgba(55, 112, 191, 0.1); }

        button { padding: 10px 16px; background: #3770BF; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        button:hover { background: #2d5aa0; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .toggle { text-align: center; margin-top: 16px; font-size: 14px; }
        .toggle button { width: auto; background: none; color: #3770BF; padding: 0; }

        .error { color: #d32f2f; font-size: 14px; margin-top: 8px; }
        .success { color: #388e3c; font-size: 14px; margin-top: 8px; }

        .dashboard { padding: 20px; }
        .dashboard h1 { margin-bottom: 20px; }
        .profile-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; }
        .profile-card .form-group { margin-bottom: 12px; }

        .nav { display: flex; gap: 10px; align-items: center; }
        .logout-btn { background: #757575; padding: 8px 16px; }
        .logout-btn:hover { background: #616161; }

        .loading { text-align: center; padding: 20px; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3770BF; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // Supabase 초기화
        const SUPABASE_URL = 'https://sqlkimtvljzieimxhgep.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1lJiHYgYu3woZEd5X3bUfg_XjXNWLL_';
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 로그인 페이지
        function LoginPage({ onLoginSuccess }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [company, setCompany] = useState('');
            const [isSignUp, setIsSignUp] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [message, setMessage] = useState('');

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setMessage('');
                setLoading(true);

                try {
                    if (isSignUp) {
                        // 회원가입
                        const { data, error: signUpError } = await supabaseClient.auth.signUp({
                            email,
                            password,
                        });
                        if (signUpError) throw signUpError;

                        // users 테이블에 프로필 저장
                        const { error: insertError } = await supabaseClient
                            .from('users')
                            .insert([{ id: data.user.id, email, name, company }]);
                        if (insertError) throw insertError;

                        setMessage('회원가입 완료! 로그인 버튼을 눌러주세요.');
                        setIsSignUp(false);
                        setEmail('');
                        setPassword('');
                        setName('');
                        setCompany('');
                    } else {
                        // 로그인
                        const { data, error: signInError } = await supabaseClient.auth.signInWithPassword({
                            email,
                            password,
                        });
                        if (signInError) throw signInError;

                        onLoginSuccess();
                    }
                } catch (err) {
                    setError(err.message || '오류가 발생했습니다.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="auth-panel">
                    <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                        <div className="logo" style={{ marginBottom: '10px' }}>OOH SIM</div>
                        <p style={{ color: '#666', fontSize: '14px' }}>로그인하여 시작하세요</p>
                    </div>

                    <form onSubmit={handleAuth}>
                        <div className="form-group">
                            <label>이메일 (회사 이메일)</label>
                            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="name@company.com" required />
                        </div>

                        <div className="form-group">
                            <label>비밀번호</label>
                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" required />
                        </div>

                        {isSignUp && (
                            <>
                                <div className="form-group">
                                    <label>이름</label>
                                    <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="홍길동" />
                                </div>

                                <div className="form-group">
                                    <label>회사</label>
                                    <input type="text" value={company} onChange={(e) => setCompany(e.target.value)} placeholder="Cheil" />
                                </div>
                            </>
                        )}

                        <button type="submit" disabled={loading}>
                            {loading ? '처리 중...' : isSignUp ? '회원가입' : '로그인'}
                        </button>

                        {error && <div className="error">{error}</div>}
                        {message && <div className="success">{message}</div>}
                    </form>

                    <div className="toggle">
                        {isSignUp ? '계정이 있으신가요?' : '계정이 없으신가요?'}
                        <button onClick={() => { setIsSignUp(!isSignUp); setError(''); setMessage(''); }}>
                            {isSignUp ? '로그인' : '회원가입'}
                        </button>
                    </div>
                </div>
            );
        }

        // 대시보드
        function Dashboard({ user, onLogout }) {
            const [profile, setProfile] = useState({ name: '', company: '' });
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');

            useEffect(() => {
                loadProfile();
            }, [user]);

            const loadProfile = async () => {
                try {
                    const { data, error } = await supabaseClient
                        .from('users')
                        .select('name, company')
                        .eq('id', user.id)
                        .single();
                    if (error && error.code !== 'PGRST116') throw error;
                    if (data) setProfile({ name: data.name || '', company: data.company || '' });
                } catch (err) {
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            const handleSaveProfile = async (e) => {
                e.preventDefault();
                setSaving(true);
                setMessage('');

                try {
                    const { error } = await supabaseClient
                        .from('users')
                        .update(profile)
                        .eq('id', user.id);
                    if (error) throw error;
                    setMessage('프로필이 저장되었습니다.');
                } catch (err) {
                    setMessage('오류: ' + err.message);
                } finally {
                    setSaving(false);
                }
            };

            if (loading) {
                return <div className="loading"><div className="spinner"></div></div>;
            }

            return (
                <div className="dashboard">
                    <div className="header">
                        <div className="logo">OOH SIM</div>
                        <div className="nav">
                            <span style={{ fontSize: '14px', color: '#666' }}>{user.email}</span>
                            <button className="logout-btn" onClick={onLogout}>로그아웃</button>
                        </div>
                    </div>

                    <h1>프로필</h1>
                    <div className="profile-card">
                        <form onSubmit={handleSaveProfile}>
                            <div className="form-group">
                                <label>이메일</label>
                                <input type="email" value={user.email} disabled style={{ background: '#f5f5f5', cursor: 'not-allowed' }} />
                            </div>

                            <div className="form-group">
                                <label>이름</label>
                                <input type="text" value={profile.name} onChange={(e) => setProfile({ ...profile, name: e.target.value })} placeholder="홍길동" />
                            </div>

                            <div className="form-group">
                                <label>회사</label>
                                <input type="text" value={profile.company} onChange={(e) => setProfile({ ...profile, company: e.target.value })} placeholder="Cheil" />
                            </div>

                            <button type="submit" disabled={saving}>
                                {saving ? '저장 중...' : '프로필 저장'}
                            </button>

                            {message && <div className="success">{message}</div>}
                        </form>
                    </div>
                </div>
            );
        }

        // 메인 앱
        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                checkSession();
            }, []);

            const checkSession = async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                setUser(session?.user || null);
                setLoading(false);
            };

            if (loading) {
                return <div className="loading"><div className="spinner"></div></div>;
            }

            return user ? (
                <Dashboard user={user} onLogout={async () => {
                    await supabaseClient.auth.signOut();
                    setUser(null);
                }} />
            ) : (
                <LoginPage onLoginSuccess={checkSession} />
            );
        }

        // React 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
